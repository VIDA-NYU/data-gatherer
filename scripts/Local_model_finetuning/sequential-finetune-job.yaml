apiVersion: batch/v1
kind: Job
metadata:
  name: t5-finetune
  namespace: data-gatherer
spec:
  template:
    spec:
      containers:
      - name: t5-finetune
        image: pietromarini/data-gatherer-nvidia:20260501
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          set -e

          echo "=== fetching latest ground truth from HF ===" && \
          mkdir -p /app/scripts/Local_model_finetuning/ground_truth && \
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://huggingface.co/datasets/vida-nyu/pmc-articles-dataset-mentions-snippets/resolve/main/gt_dataset_info_extraction_from_snippet.xlsx', '/app/scripts/Local_model_finetuning/ground_truth/gt_dataset_info_extraction_from_snippet.xlsx')"

          echo "=== [1/1] flan-t5-base ===" && \
          python3 /app/scripts/Local_model_finetuning/train_seq2seq.py \
            --pmc_links    /app/scripts/exp_input/REV.txt \
            --ground_truth /app/scripts/Local_model_finetuning/ground_truth/gt_dataset_info_extraction_from_snippet.xlsx \
            --output_dir   /data/flan-t5-models \
            --epochs       5 \
            --lr           3e-4 \
            --train_batch  2 \
            --eval_batch   2 \
            --grad_accum   8

          echo "=== fine-tuning job complete ==="
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
          requests:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
        env:
        - name: EMBEDDINGS_DEVICE
          value: "cuda"
        envFrom:
        - secretRef:
            name: data-gatherer-env-secret
        volumeMounts:
        - name: data-pvc
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: data-pvc
        persistentVolumeClaim:
          claimName: data-gatherer-pvc
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-H100-NVL
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-RTX-A6000
                - Quadro-RTX-8000
                - Tesla-V100-SXM2-16GB
              - key: nvidia.com/gpu.compute.major
                operator: NotIn
                values:
                - "7"
      restartPolicy: Never
