apiVersion: batch/v1
kind: Job
metadata:
  name: data-gatherer-batch-slice-${SLICE_ID}${JOB_SUFFIX}
  namespace: data-gatherer
spec:
  template:
    spec:
      containers:
      - name: data-gatherer
        image: pietromarini/data-gatherer-nvidia:20260501
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          python3 k8s/k8s_processor.py \
            --input /tmp/slice_${SLICE_ID}.csv \
            --output-dir /tmp/output/slice_${SLICE_ID}${JOB_SUFFIX} \
            --model hf-vida-nyu/flan-t5-base-dataref-info-extract \
            --batch-size 100 \
            --max-articles ${MAX_ARTICLES} \
            --s3-input-key input/slice_${SLICE_ID}.csv \
            --s3-ontology-key ontology/open_bio_data_repos.json \
            --s3-skip-urls-key input/skip_urls.json \
            --semantic-retrieval ${SEMANTIC_RETRIEVAL:-true} \
            --brute-force-regex ${BRUTE_FORCE_REGEX:-true} \
            --top-k ${TOP_K:-5}
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
          requests:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
        env:
        - name: MOZ_DISABLE_CONTENT_SANDBOX
          value: "1"
        - name: GECKODRIVER_LOG_PATH
          value: "/tmp/logs/geckodriver.log"
        - name: LLM_PROMPTS_LOG_PATH
          value: "/tmp/logs/llm_prompts.log"
        - name: EMBEDDINGS_DEVICE
          value: "cuda"
        envFrom:
        - secretRef:
            name: data-gatherer-env-secret
        - secretRef:
            name: data-gatherer-s3-secret
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-H100-NVL
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-RTX-A6000
                - Quadro-RTX-8000
                - Tesla-V100-SXM2-16GB
              - key: nvidia.com/gpu.compute.major
                operator: NotIn
                values:
                - "7"
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      restartPolicy: OnFailure
