apiVersion: batch/v1
kind: Job
metadata:
  name: data-gatherer-batch-slice-${SLICE_ID}${JOB_SUFFIX}
  namespace: data-gatherer
spec:
  template:
    spec:
      containers:
      - name: data-gatherer
        image: pietromarini/data-gatherer-nvidia:20260501
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          OUTPUT_DIR=/tmp/output/slice_${SLICE_ID}${JOB_SUFFIX}
          mkdir -p "$OUTPUT_DIR"

          # Zero-dependency GPU power sampling for this job's lifetime (approximate
          # energy cost — integrate power.draw over time to get watt-hours).
          nvidia-smi --query-gpu=timestamp,power.draw --format=csv -l 5 > "$OUTPUT_DIR/gpu_power.csv" &
          GPU_SAMPLER_PID=$!

          python3 k8s/k8s_processor.py \
            --input /tmp/slice_${SLICE_ID}.csv \
            --output-dir "$OUTPUT_DIR" \
            --model ${MODEL} \
            --prompt-name ${PROMPT_NAME} \
            --batch-size 100 \
            --max-articles ${MAX_ARTICLES} \
            --s3-input-key input/slice_${SLICE_ID}.csv \
            --s3-ontology-key ontology/open_bio_data_repos.json \
            --s3-skip-urls-key input/skip_urls.json \
            --s3-backup-key ${S3_BACKUP_KEY} \
            --skip-already-processed ${SKIP_ALREADY_PROCESSED} \
            --semantic-retrieval ${SEMANTIC_RETRIEVAL} \
            --brute-force-regex ${BRUTE_FORCE_REGEX} \
            --top-k ${TOP_K} \
            --sects-required ${SECTS_REQUIRED}
          JOB_EXIT_CODE=$?

          kill "$GPU_SAMPLER_PID" 2>/dev/null
          wait "$GPU_SAMPLER_PID" 2>/dev/null

          # Use boto3 (not the aws CLI, which isn't installed in this image — the
          # rest of this image's S3 I/O goes through k8s_processor.py's boto3 calls).
          python3 -c "import boto3, os; bucket = os.environ.get('S3_OUTPUT_BUCKET'); gpu_log = '$OUTPUT_DIR/gpu_power.csv'; print('Uploading gpu_power.csv to S3' if (bucket and os.path.exists(gpu_log)) else f'Skipping gpu_power.csv upload (bucket={bucket!r}, exists={os.path.exists(gpu_log)})'); (bucket and os.path.exists(gpu_log)) and boto3.client('s3').upload_file(gpu_log, bucket, 'slice_${SLICE_ID}${JOB_SUFFIX}/gpu_power.csv')"

          exit $JOB_EXIT_CODE
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
          requests:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
        env:
        - name: MOZ_DISABLE_CONTENT_SANDBOX
          value: "1"
        - name: GECKODRIVER_LOG_PATH
          value: "/tmp/logs/geckodriver.log"
        - name: LLM_PROMPTS_LOG_PATH
          value: "/tmp/logs/llm_prompts.log"
        - name: EMBEDDINGS_DEVICE
          value: "cuda"
        envFrom:
        - secretRef:
            name: data-gatherer-env-secret
        - secretRef:
            name: data-gatherer-s3-secret
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-H100-NVL
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-RTX-A6000
                - Quadro-RTX-8000
                - Tesla-V100-SXM2-16GB
              - key: nvidia.com/gpu.compute.major
                operator: NotIn
                values:
                - "7"
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      restartPolicy: OnFailure
